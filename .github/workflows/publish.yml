name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: macos-latest
    environment: pypi
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  test-pypi-install:
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.11']

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Wait for PyPI propagation
      run: sleep 300  # Wait 5 minutes for PyPI to propagate

    - name: Install from PyPI
      run: |
        python -m pip install --upgrade pip
        pip install virtual-gpu-lut-box

    - name: Test installation
      run: |
        virtual-gpu-lut-box --version
        virtual-gpu-lut-box info

    - name: Test package import
      run: |
        python -c "from virtual_gpu_lut_box import VirtualGPULUTBoxServer; print('PyPI install successful')"
