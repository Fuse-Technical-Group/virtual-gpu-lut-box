# Dependabot version-update PRs. Complements (does not replace) Dependabot
# security updates, which open PRs for vulnerability alerts independently.
#
# `build(deps):` keeps each PR out of flywheel's auto_merge types
# (.flywheel.yml), so a bump waits for a human review. A release has a week
# to draw a follow-up fix before it is proposed. Major updates open on their
# own, outside the minor-and-patch groups.
version: 2
updates:
  # Actions are SHA-pinned with a trailing version comment; Dependabot bumps
  # the SHA and rewrites the comment. The notation reusable workflow is pinned
  # to a notation--v* tag, which Dependabot does not track, so bump that by
  # hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build"
      include: "scope"

  # Moves uv.lock, and touches pyproject.toml only when a release crosses a
  # bound. requires-python stays at 3.11 for TouchDesigner, so the lock
  # resolves each package to its last 3.11-compatible release.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    # ruff and pyright bring new findings that need code edits, so they do
    # not hold up the library bumps.
    groups:
      python-lint:
        patterns: ["ruff", "pyright"]
      python-packages:
        patterns: ["*"]
        exclude-patterns: ["ruff", "pyright"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build"
      include: "scope"

  # Hook revs in .pre-commit-config.yaml. Keep the ruff-pre-commit and
  # pyright-python revs equal to the ruff and pyright versions in uv.lock.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pre-commit-hooks:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build"
      include: "scope"
